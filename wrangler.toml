name = "aura"
compatibility_date = "2024-11-01"
pages_build_output_dir = "dist"

# Replace this placeholder only when using Wrangler locally or for manual
# deployment. For Git-connected Pages, create the binding in the dashboard.
[[d1_databases]]
binding = "DB"
database_name = "aura-db"
database_id = "replace-with-your-d1-database-id"

# Workers AI is also configured as a Pages binding in the dashboard.
[ai]
binding = "AI"
